<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CSave Staff Console</title>
<style>
:root{--bg:#f6f3ee;--panel:#fff;--line:#e4ddd2;--ink:#1b1712;--mute:#6f675d;--o:#d4730a;--d:#9a4a0c;--red:#d83a3f;--ok:#1f9d6b;--warn:#c98a00}
@media (prefers-color-scheme:dark){:root{--bg:#0e0e0e;--panel:#1a1a1a;--line:#2b2b2b;--ink:#f4f1ee;--mute:#9a948c}}
:root[data-t=light]{--bg:#f6f3ee;--panel:#fff;--line:#e4ddd2;--ink:#1b1712;--mute:#6f675d}
:root[data-t=dark]{--bg:#0e0e0e;--panel:#1a1a1a;--line:#2b2b2b;--ink:#f4f1ee;--mute:#9a948c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,system-ui,sans-serif;font-size:15px;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{background:linear-gradient(135deg,var(--o),var(--d));color:#fff;padding:14px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header b{font-size:20px}header .sp{flex:1}header small{opacity:.85}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
button,.btn{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 14px;background:var(--o);color:#fff;font-weight:600}
button.g{background:transparent;border:1px solid var(--line);color:var(--ink)}button.r{background:var(--red)}button.s{padding:5px 10px;font-size:13px}
nav button{background:transparent;color:var(--mute);white-space:nowrap}nav button.on{background:var(--o);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--o);outline-offset:2px}
main{max-width:1100px;margin:0 auto;padding:16px}h2{margin:4px 0 12px}h3{margin:16px 0 8px}
input,select,textarea{font:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;margin:0 0 8px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}.cards .card{margin:0}.card .k{color:var(--mute);font-size:13px}.card .v{font-size:24px;font-weight:700}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:14px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--mute);font-weight:600;font-size:12px;text-transform:uppercase}
.wrap{overflow-x:auto}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>input,.row>select{width:auto;flex:1;min-width:130px}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;color:#fff;background:#777}.b-ok{background:var(--ok)}.b-bad{background:var(--red)}.b-warn{background:var(--warn)}
.two{display:grid;grid-template-columns:minmax(220px,1fr) 2fr;gap:14px}@media(max-width:760px){.two{grid-template-columns:1fr}}
.msg{padding:9px 12px;border-radius:12px;margin:6px 0;max-width:90%;background:var(--bg);border:1px solid var(--line)}.msg.me{margin-left:auto;background:var(--o);color:#fff;border:0}.msg.st{background:#1f6f54;color:#fff;border:0}
.mute{color:var(--mute)}.sm{font-size:13px}.err{color:var(--red);margin:6px 0}.ok{color:var(--ok);margin:6px 0}
.login{max-width:420px;margin:7vh auto;padding:0 16px}.login .hero{background:linear-gradient(135deg,var(--o),var(--d));color:#fff;border-radius:20px;padding:22px;text-align:center;margin-bottom:16px}.login .hero b{font-size:34px}
.logo{height:42px;width:42px;border-radius:10px;background:#fff;object-fit:contain}.logo.big{height:96px;width:96px;border-radius:18px;margin-bottom:8px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.thumbs div{position:relative}.thumbs img,.annimg{width:150px;aspect-ratio:10/3;object-fit:cover;border-radius:10px;border:1px solid var(--line)}.thumbs button{position:absolute;top:4px;right:4px;padding:2px 8px}
.bar{height:8px;background:var(--line);border-radius:5px}.bar>i{display:block;height:8px;background:var(--o);border-radius:5px}
textarea{min-height:110px;font-family:ui-monospace,Consolas,monospace;font-size:13px}.chat{max-height:380px;overflow-y:auto}
</style></head><body><div id="app"></div>

const DEMO=false;
async function api(method,path,body){
  const r=await fetch(path,{method,headers:{'Content-Type':'application/json',Authorization:'Bearer '+(S.token||'')},body:body?JSON.stringify(body):undefined});
  if((r.headers.get('content-type')||'').includes('text/csv'))return r.text();
  const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Something went wrong.');return d}
/*ENDAPI*/
const S={token:null,me:null,tab:null,sub:{},ticket:null,ch:'all',msg:null,otp:null,theme:null};
try{S.token=sessionStorage.getItem('t')}catch(e){}
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id),V=id=>$(id)?$(id).value:'';
const fmt=n=>'₦'+Math.round(n||0).toLocaleString('en-NG');
const dt=s=>s?new Date(s).toLocaleString('en-NG',{dateStyle:'medium',timeStyle:'short'}):'';
const card=(k,v)=>`<div class="card"><div class="k">${E(k)}</div><div class="v">${E(v)}</div></div>`;
const bd=(t,c)=>`<span class="badge ${c||''}">${E(t)}</span>`;
const tbl=(h,rows)=>`<div class="wrap"><table><thead><tr>${h.map(x=>`<th>${E(x)}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${h.length}" class="mute">Nothing here yet.</td></tr>`}</tbody></table></div>`;
const subnav=(key,items)=>`<div class="row" style="margin-bottom:12px">${items.map(([k,l])=>`<button class="s ${(S.sub[key]||items[0][0])===k?'':'g'}" data-a="sub" data-v="${key}:${k}">${l}</button>`).join('')}</div>`;
const sub=(key,def)=>S.sub[key]||def;
const TABS={admin:[['dash','Dashboard'],['members','Members'],['support','Customer service'],['finance','Finance'],['ops','Operations'],['tech','Technical'],['team','Team chat'],['staff','Staff and invites'],['referrals','Referrals'],['approvals','Approvals'],['audit','Audit log'],['agent','AI agent'],['ainotes','Train AI coach'],['profile','My profile']],
 finance:[['finance','Finance'],['approvals','Approvals'],['referrals','Referrals'],['members','Members'],['team','Team chat'],['ainotes','Train AI coach'],['profile','My profile']],
 operations:[['ops','Operations'],['referrals','Referrals'],['members','Members'],['team','Team chat'],['ainotes','Train AI coach'],['profile','My profile']],
 support:[['support','Customer service'],['team','Team chat'],['ainotes','Train AI coach'],['profile','My profile']],
 tech:[['tech','Technical'],['approvals','Approvals'],['team','Team chat'],['ainotes','Train AI coach'],['profile','My profile']]};
const CH=['all','finance','operations','support','tech','admin'];

// ---------------- screens ----------------
function render(){
  if(S.theme)document.documentElement.dataset.t=S.theme;
  const inv=new URLSearchParams(location.search).get('invite');
  if(!S.me)return inv?inviteView(inv):loginView();
  const tabs=TABS[S.me.role]||[];if(!S.tab||!tabs.some(t=>t[0]===S.tab))S.tab=tabs[0][0];
  $('app').innerHTML=`<header><img src="${LOGO}" alt="Abia C'save" class="logo"><small>Staff console</small><span class="sp"></span><small>${E(S.me.name)} · ${E(S.me.roleLabel)}</small><button class="g s" style="color:#fff;border-color:#fff8" data-a="theme">◐</button><button class="g s" style="color:#fff;border-color:#fff8" data-a="out">Sign out</button></header>
  <nav>${tabs.map(t=>`<button class="${S.tab===t[0]?'on':''}" data-a="tab" data-v="${t[0]}">${t[1]}</button>`).join('')}</nav><main id="main"><p class="mute">Loading…</p></main>`;
  load()}
async function load(){const m=$('main');try{m.innerHTML=await VIEWS[S.tab]();if(AFTER[S.tab])AFTER[S.tab]()}catch(e){m.innerHTML=`<div class="err">${E(e.message)}</div>`}}
function loginView(){
  $('app').innerHTML=`<div class="login"><div class="hero"><img src="${LOGO}" alt="Abia C'save" class="logo big"><div>Staff console</div></div><div class="card">
  ${S.otp?`<h3 style="margin-top:0">Enter your code</h3><p class="mute sm">We emailed a 6-digit code to ${E(S.otp)}. It works for 10 minutes.</p><input id="code" inputmode="numeric" maxlength="6" placeholder="6-digit code" aria-label="Code"><button data-a="verify" style="width:100%">Verify and sign in</button>`
  :`<h3 style="margin-top:0">Sign in</h3><input id="em" type="email" placeholder="Work email" aria-label="Email" ${DEMO?'value="admin@csave.demo"':''}><input id="pw" type="password" placeholder="Password" aria-label="Password" ${DEMO?'value="demo-password"':''}><button data-a="login" style="width:100%">Continue</button>`}
  ${S.msg?`<div class="err">${E(S.msg)}</div>`:''}${DEMO?`<p class="mute sm">Demo: pick a role, then use code 123456.</p><div class="row">${['admin','finance','operations','support','tech'].map(r=>`<button class="g s" data-a="demorole" data-v="${r}">${r}</button>`).join('')}</div>`:''}</div></div>`}
function inviteView(tok){
  $('app').innerHTML=`<div class="login"><div class="hero"><img src="${LOGO}" alt="Abia C'save" class="logo big"><div>Create your staff profile</div></div><div class="card" id="inv"><p class="mute">Checking your invite…</p></div></div>`;
  api('GET','/api/staff/invite/'+encodeURIComponent(tok)).then(i=>{$('inv').innerHTML=`<p>You were invited as <b>${E(i.roleLabel)}</b> with <b>${E(i.email)}</b>. You will only see what that role needs.</p><input id="nm" placeholder="Full name" aria-label="Full name"><input id="np" type="password" placeholder="Choose a password (10+ characters)" aria-label="Password"><button data-a="accept" data-v="${E(tok)}" style="width:100%">Create profile</button><div id="im"></div>`}).catch(e=>{$('inv').innerHTML=`<div class="err">${E(e.message)}</div>`})}
const badgeKyc=k=>bd('KYC '+(k==='none'?'not submitted':k),k==='approved'?'b-ok':k==='pending'?'b-warn':k==='rejected'?'b-bad':'');

const VIEWS={
async dash(){const [a,f,t,c]=await Promise.all([api('GET','/api/ops/analytics'),api('GET','/api/finance/summary'),api('GET','/api/support/tickets'),api('GET','/api/tech/crashes')]);
 return `<h2>Dashboard</h2><div class="cards">${card('Members',a.total)}${card('KYC waiting',a.kyc.pending||0)}${card('Membership paid',a.membershipPaid)}${card('Active last 7 days',a.activeLast7Days)}${card('Deposits (30 days)',fmt(f.deposit.total))}${card('Withdrawals (30 days)',fmt(f.withdraw.total))}${card('Open tickets',t.length)}${card('Crash rate (7 days)',c.crashRatePct==null?'n/a':c.crashRatePct+'%')}</div><p class="mute">Ask the AI agent tab anything about what is happening, for example "who approved KYC today?".</p>`},
async members(){const m=await api('GET','/api/admin/members'),can=['admin','operations'].includes(S.me.role),canCredit=['admin','finance'].includes(S.me.role);
 return `<h2>Members</h2>`+tbl(['Name','Email','KYC','Membership','ID',''],m.map(x=>[E(x.name),E(x.email),badgeKyc(x.kycStatus),x.membershipPaid?bd('Paid','b-ok'):bd('Not paid'),E(x.membershipId||''),
  (can?(x.kycStatus==='pending'?`<button class="s g" data-a="kycview" data-v="${x._id}">View ID</button> <button class="s" data-a="kyc" data-v="${x._id}:approved">Approve (${x.approvals||0}/${x.approvalsNeeded||2})</button> <button class="s r" data-a="kyc" data-v="${x._id}:rejected">Reject</button> `:'')+(x.kycStatus==='approved'?`<button class="s r" data-a="kyc" data-v="${x._id}:revoked">Revoke KYC</button> `:'')+(x.membershipPaid?`<button class="s g" data-a="resend" data-v="${x._id}">Resend ID email</button> `:''):'')+(canCredit?`<button class="s" data-a="credit" data-v="${x._id}">Credit wallet</button>`:'')]))},
async support(){const t=await api('GET','/api/support/tickets');let det='<p class="mute">Pick a ticket.</p>';
 if(S.ticket){const d=await api('GET','/api/support/tickets/'+S.ticket);det=`<div class="card"><b>${E(d.member)}</b> <span class="mute sm">${E(d.email)} · Member ${E(d.membershipId||'not yet')} · KYC ${E(d.kycStatus||'-')}</span><div class="chat">${d.messages.map(m=>`<div class="msg ${m.role==='member'?'me':m.role==='staff'?'st':''}"><div class="sm" style="opacity:.75">${m.role==='ai'?'AI':m.role==='staff'?'Customer service':'Member'}</div>${E(m.text)}${m.review==='confirmed'?' <span class="ok sm">✔ confirmed</span>':''}${m.role==='ai'&&m.review==='pending'?`<div><button class="s" data-a="conf" data-v="${d.id}:${m.id}">Confirm</button> <button class="s g" data-a="corr" data-v="${d.id}:${m.id}">Correct with text below</button></div>`:''}</div>`).join('')}</div>

 case 'theme':S.theme=(document.documentElement.dataset.t==='dark'||(!document.documentElement.dataset.t&&matchMedia('(prefers-color-scheme:dark)').matches))?'light':'dark';return render();
 case 'out':S.token=null;S.me=null;S.otp=null;try{sessionStorage.removeItem('t')}catch(e){};return render();
 case 'demorole':$('em').value=v+'@csave.demo';return;
 case 'login':{const d=await api('POST','/api/auth/login',{email:V('em'),password:V('pw')});if(d.otpRequired){S.otp=V('em');S.loginEmail=V('em')}else{await signedIn(d)}return render()}
 case 'verify':{const d=await api('POST','/api/auth/verify-otp',{email:S.otp,code:V('code')});S.otp=null;await signedIn(d);return render()}
 case 'accept':{await api('POST','/api/staff/accept',{token:v,name:V('nm'),password:V('np')});$('im').innerHTML='<div class="ok">Profile created. Sign in with your email and password.</div>';setTimeout(()=>{history.replaceState({},'',location.pathname);render()},1500);return}
 case 'tab':S.tab=v;S.ticket=null;S.csvText=null;S.recon=null;return render();
 case 'sub':{const [k,s]=v.split(':');S.sub[k]=s;S.csvText=null;return load()}
 case 'kyc':{const [id,dec]=v.split(':');let reason='';if(dec==='rejected'||dec==='revoked'){reason=(prompt(dec==='revoked'?'Reason for revoking this KYC (the member will see it):':'Reason for rejecting (the member will see it):')||'').trim();if(reason.length<5){note('A reason of at least 5 characters is needed.',0);return}}const r=await api('POST','/api/admin/kyc/'+id,{decision:dec,reason});note(r.status==='pending'?`Approval recorded (${r.approvals} of ${r.approvalsNeeded}). A different staff member must give the next one.`:r.status==='approved'?'KYC approved.':'KYC rejected.',1);return load()}
 case 'kycview':{const k=await api('GET','/api/admin/kyc/'+v);alert(`${k.name}\nPhone: ${k.phone}\nDate of birth: ${k.dob}\nGender: ${k.gender}\nMarital status: ${k.maritalStatus}\nOccupation: ${k.occupation}\nPlace of origin: ${k.placeOfOrigin}\nResidential address: ${k.address}\nProof of address: ${k.proofOfAddress}\nNext of kin: ${k.nextOfKin}\nID type: ${k.idType}\nID number: ${k.idNumber||('(not stored) ends '+k.idLast4)}\nBVN check: ${k.idType!=='BVN'?'not needed for this ID type':k.bvnCheck==='match'?'name and date of birth matched the BVN register (Dojah)':k.bvnCheck==='off'?'not switched on (no Dojah keys)':'NOT CHECKED (service did not answer). Check it by hand.'}\n\nCheck the ID number and name against the ID document or the NIN/BVN record before approving. This view is recorded in the audit log.`);return}
 case 'credit':{const amt=prompt('Amount in naira to add to this member\'s wallet');if(!amt)return;const nt=prompt('Reason (kept in the ledger)')||'';const r=await api('POST','/api/admin/wallet/'+v+'/credit',{amount:Number(amt),note:nt});note('Wallet credited. New balance '+fmt(r.balance)+'.',1);return load()}
case 'rate':{const r=prompt('Propose a new interest rate, percent per year (0 to 100)',v);if(r===null)return;const why=prompt('Why is this change needed? (at least 5 characters)')||'';await api('POST','/api/admin/changes',{kind:'interest',ratePercent:Number(r),note:why});note('Proposed. A second admin must approve it, then tech pushes it live.',1);return load()}
 case 'ref-propose':{const type=V('rt'),value=Number(V('rv')),why=V('rn')||'';if(why.trim().length<5){note('Give a reason of at least 5 characters.');return load()}await api('POST','/api/admin/changes',{kind:'referral',rule:{type,value:type==='off'?0:value},note:why});note('Proposed. A second admin must approve it, then tech pushes it live.',1);return load()}
 case 'chg-approve':{await api('POST','/api/admin/changes/'+v+'/approve');note('Approved. Tech can now push it live.',1);return load()}
 case 'chg-reject':{await api('POST','/api/admin/changes/'+v+'/reject');note('Rejected.',1);return load()}
 case 'mon-run':{await api('POST','/api/tech/monitor/run');note('Checked now.',1);return load()}
 case 'mon-ack':{await api('POST','/api/tech/monitor/'+v+'/ack');note('Marked as seen.',1);return load()}
 case 'mon-ai':{S.monAi=null;try{S.monAi=(await api('POST','/api/tech/monitor/explain')).reply}catch(err){S.monAi=err.message}return load()}
 case 'chg-push':{await api('POST','/api/admin/changes/'+v+'/push');note('Pushed live.',1);return load()}
 case 'refcsv':{const t=await api('GET','/api/admin/referrals.csv');const u=URL.createObjectURL(new Blob([t],{type:'text/csv'})),l=document.createElement('a');l.href=u;l.download='csave-referrals.csv';l.click();URL.revokeObjectURL(u);return}
 case 'auditcsv':{const k=sub('aud','all');const t=await api('GET','/api/admin/audit.csv'+(k==='actions'?'?kind=actions':k==='requests'?'?kind=requests':''));const u=URL.createObjectURL(new Blob([t],{type:'text/csv'})),l=document.createElement('a');l.href=u;l.download='csave-audit.csv';l.click();URL.revokeObjectURL(u);return}
 case 'resend':{const r=await api('POST','/api/admin/members/'+v+'/resend-email');alert(r.ok?'Email sent.':'Email could not be sent.');return}
 case 'ticket':S.ticket=v;return load();
 case 'conf':{const [t,m]=v.split(':');await api('POST',`/api/support/tickets/${t}/messages/${m}/confirm`,{});return load()}
 case 'corr':{const [t,m]=v.split(':'),c=V('rep').trim();if(!c)return alert('Write the correction in the reply box first.');await api('POST',`/api/support/tickets/${t}/messages/${m}/confirm`,{correction:c});return load()}
 case 'reply':{const c=V('rep').trim();if(!c)return;await api('POST',`/api/support/tickets/${v}/reply`,{text:c});return load()}
 case 'resolve':await api('POST',`/api/support/tickets/${v}/resolve`);S.ticket=null;return load();
 case 'faqadd':await api('POST','/api/support/faq',{q:V('fq'),a:V('fa')});return load();
 case 'faqdel':await api('DELETE','/api/support/faq/'+v);return load();
 case 'range':S.fd=V('fd');S.td=V('td');return load();
 case 'csv':{const t=await api('GET','/api/finance/export.csv?from='+(S.fd||'')+'&to='+(S.td||''));if(DEMO){S.csvText=t}else{const u=URL.createObjectURL(new Blob([t],{type:'text/csv'})),l=document.createElement('a');l.href=u;l.download='csave-transactions.csv';l.click();URL.revokeObjectURL(u)}return load()}
 case 'recon':{S.rcsv=V('rcsv');const rows=S.rcsv.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const p=l.split(',');return{ref:p[0],amount:p[1],date:p[2]}});const r=await api('POST','/api/finance/reconcile',{rows,source:'pasted statement'}),s=r.summary;
  S.recon=`<div class="cards">${card('Matched',s.matched+' of '+s.statementRows)}${card('Left on statement',s.unmatchedStatement+' · '+fmt(s.unmatchedStatementTotal))}${card('Left in our ledger',s.unmatchedLedger+' · '+fmt(s.unmatchedLedgerTotal))}</div><h3>On the statement but not in our records</h3>`+tbl(['Reference','Amount','Date'],r.unmatchedStatement.map(x=>[E(x.ref),fmt(x.amount),E(x.date)]))+`<h3>In our records but not on the statement</h3>`+tbl(['Date','Kind','Amount','Member','Reference'],r.unmatchedLedger.map(x=>[dt(x.at),E(x.kind),fmt(x.amount),E(x.member),E(x.ref)]));return load()}
 case 'journal':{const lines=[1,2].map(n=>({account:V('ja'+n),debit:V('jd'+n),credit:V('jc'+n)}));await api('POST','/api/finance/journal',{memo:V('jm'),lines});note('Entry posted.',1);return load()}
 case 'announce':{const keys=[];for(const u of (S.imgs||[])){const m=await api('POST','/api/ops/media',{dataUrl:u});keys.push(m.key)}const r=await api('POST','/api/ops/announcements',{title:V('at'),body:V('ab'),images:keys});S.imgs=[];S.at='';S.ab='';note('Sent to '+r.sentTo+' members.',1);return load()}
 case 'imgdel':S.at=V('at');S.ab=V('ab');S.imgs.splice(+v,1);return load();
 case 'budsave':{const categories=V('bc').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const [name,color]=l.split(',');return{name:(name||'').trim(),color:(color||'').trim()}}),tasks=V('bt').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const i=l.indexOf('|');return i>0?{emoji:l.slice(0,i).trim(),text:l.slice(i+1).trim()}:{emoji:'✅',text:l}});await api('POST','/api/ops/budget-defaults',{categories,tasks});note('Saved. New members will start with these.',1);return load()}
 case 'ch':S.ch=v;return load();
 case 'tsend':{const m=V('tm').trim();if(!m)return;await api('POST','/api/team/messages',{channel:S.ch,text:m,ref:V('tr')});return load()}
 case 'invite':{const r=await api('POST','/api/admin/invites',{email:V('ie'),role:V('ir')});note(r.emailed?'Invite emailed.':'Email could not be sent. Share this link yourself: '+r.link,1);return load()}
 case 'role':await api('POST',`/api/admin/staff/${v}/role`,{role:x});return load();
 case 'active':{const [id,on]=v.split(':');await api('POST',`/api/admin/staff/${id}/active`,{active:on==='1'});return load()}
 case 'ask':{const q=v||V('aq').trim();if(!q)return;S.agent=(S.agent||[]).concat({r:'me',t:q});render();const r=await api('POST','/api/admin/agent',{question:q});S.agent.push({r:'ai',t:r.reply});return render()}
 case 'noteadd':await api('POST','/api/staff/ai-notes',{text:V('nt')});return load();
 case 'notedel':await api('DELETE','/api/staff/ai-notes/'+v);return load();
 case 'pname':await api('POST','/api/staff/profile',{name:V('pn')});S.me.name=V('pn');note('Name saved.',1);return render();
 case 'ppass':await api('POST','/api/staff/password',{current:V('p1'),next:V('p2')});note('Password changed.',1);return load();
 }}catch(err){if(['login','verify','accept'].includes(a)){S.msg=err.message;return render()}note(err.message,0);if(a==='ask'&&S.agent){S.agent.push({r:'ai',t:err.message});return render()}load()}}
async function signedIn(d){S.token=d.token;try{sessionStorage.setItem('t',d.token)}catch(e){}const m=await api('GET','/api/staff/me');S.me={id:m.id,name:m.name,role:m.role,roleLabel:m.roleLabel}}
(async()=>{if(S.token){try{const m=await api('GET','/api/staff/me');S.me={id:m.id,name:m.name,role:m.role,roleLabel:m.roleLabel}}catch(e){S.token=null}}render()})();
</script></body></html>
