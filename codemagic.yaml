# Codemagic: builds the C'SAVE Android app. Repo root = this csave/ folder (app/ and backend/ inside).
# In Codemagic: create a variable group named  csave_app  with
#   API_BASE_URL  = https://api.abiacsave.com.ng   (must be https, no trailing slash)
#   TELEMETRY_KEY = same value as TELEMETRY_KEY in the backend .env (optional)
# And add the upload keystore under Teams -> Code signing identities -> Android keystores,
#   named  csave_upload_keystore  (alias: upload).
workflows:
  android-play-release:
    name: CSave Play Store release (AAB)
    max_build_duration: 30
    working_directory: app
    environment:
      flutter: stable
      java: 17
      groups:
        - csave_app
      android_signing:
        - csave_upload_keystore
    scripts:
      - name: Create Android project and apply setup
        script: python3 tool/codemagic_prepare.py
      - name: Remove sample test created by Flutter
        script: rm -rf test
      - name: Get packages
        script: flutter pub get
      - name: Check code (real errors fail the build)
        script: flutter analyze --no-fatal-infos --no-fatal-warnings lib
      - name: Build release AAB for Play
        script: flutter build appbundle --release --build-name=1.3.1 --build-number=9
    artifacts:
      - build/app/outputs/bundle/release/*.aab

  android-apk:
    name: CSave Android APK (testers)
    max_build_duration: 30
    working_directory: app
    environment:
      flutter: stable
      java: 17
      groups:
        - csave_app
      android_signing:
        - csave_upload_keystore
    scripts:
      - name: Create Android project and apply setup
        script: python3 tool/codemagic_prepare.py
      - name: Remove sample test created by Flutter
        script: rm -rf test
      - name: Get packages
        script: flutter pub get
      - name: Check code (real errors fail the build)
        script: flutter analyze --no-fatal-infos --no-fatal-warnings lib
      - name: Build release APK
        script: flutter build apk --release --build-name=1.3.1 --build-number=9
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
